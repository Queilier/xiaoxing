<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>小星科学探索</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #f4fbff 0%, #fffdf5 100%);
      min-height: 100vh;
      color: #263238;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      box-sizing: border-box;
      width: 100%;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #eef3f7;
    }

    .badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 999px;
      background: #e8f5ff;
      font-size: 18px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 38px;
      margin: 8px 0 12px;
      text-align: center;
    }

    .subtitle {
      font-size: 21px;
      line-height: 1.7;
      text-align: center;
      margin: 0 auto 22px;
      max-width: 680px;
    }

    .participant-area {
      margin-bottom: 14px;
      text-align: center;
    }

    .participant-input {
      width: 100%;
      max-width: 340px;
      font-size: 18px;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid #d8e2ea;
      outline: none;
      text-align: center;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .chat-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 60vh; /* 使用视窗高度，随屏幕调整 */
      max-height: 600px;
      min-height: 220px;
      overflow-y: auto;
      background: #fbfdff;
      border: 1px solid #edf2f7;
      border-radius: 20px;
      padding: 18px;
      margin-top: 20px;
      min-width: 0;
    }

    .message {
      display: inline-block;
      max-width: 70%;
      width: auto;
      padding: 13px 16px;
      border-radius: 18px;
      margin: 12px 0;
      font-size: 18px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      box-sizing: border-box;
    }

    .user {
      display: block;
      align-self: flex-end;
      background: #e8f5ff;
      margin-right: 0;
      margin-left: auto;
    }

    .assistant {
      display: block;
      align-self: flex-start;
      background: #fff7df;
      margin-left: 0;
      margin-right: auto;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    input {
      flex: 1;
      font-size: 18px;
      padding: 14px 16px;
      border-radius: 999px;
      border: 1px solid #d8e2ea;
      outline: none;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    button {
      font-size: 18px;
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #e8f5ff;
      color: #263238;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    button:hover {
      background: #d8efff;
    }

    .primary {
      background: #dff4df;
    }

    .primary:hover {
      background: #cdefcd;
    }

    .voice-button {
      background: #fff3cd;
      min-width: 130px;
    }

    .voice-button.recording {
      background: #ffe69c;
      transform: scale(0.98);
    }

    .status {
      margin-top: 12px;
      color: #607d8b;
      font-size: 15px;
      text-align: center;
    }


    .tts-replay-area {
      margin-top: 10px;
      text-align: center;
      min-height: 0;
    }

    .tts-replay-button {
      font-size: 16px;
      padding: 10px 18px;
      background: #fff3cd;
      border-radius: 999px;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 18px;
      }

      .message {
        max-width: 80%;
        font-size: 17px;
      }

      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .participant-input {
        max-width: 100%;
      }

      .page { padding: 20px 12px; }

      .chat-box { height: 50vh; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <div style="text-align:center;">
        <div class="badge">科学小视频活动</div>
        <h1>小星科学探索</h1>
        <p class="subtitle">
          你可以和小星一起探索有趣的科学现象。<br />
          按住“按住说话”按钮，说完后松开，小星会回答并读出来。
        </p>
      </div>

      <div style="text-align:center;">
        <div class="participant-area">
          <input
            id="participantId"
            class="participant-input"
            placeholder="请输入被试编号，例如 001"
          />
        </div>

        <button id="startChatBtn" class="primary" onclick="startChat()">开始探索</button>
        <button onclick="resetChat()">重新开始</button>
      </div>

      <div id="chatBox" class="chat-box"></div>

      <div class="controls">
        <input id="userInput" placeholder="也可以在这里打字输入问题..." />

        <button
          id="holdToTalkButton"
          class="voice-button"
          onmousedown="startHoldVoiceInput(event)"
          onmouseup="stopHoldVoiceInput(event)"
          onmouseleave="cancelHoldVoiceInput(event)"
          ontouchstart="startHoldVoiceInput(event)"
          ontouchend="stopHoldVoiceInput(event)"
          ontouchcancel="cancelHoldVoiceInput(event)"
          oncontextmenu="event.preventDefault()"
        >
          按住说话
        </button>

        <button onclick="sendMessage()">发送</button>
        <button id="downloadDataBtn" onclick="downloadData()">下载数据</button>
      </div>

      <div id="status" class="status">
        请先输入被试编号，然后点击“开始探索”。
      </div>
      <div id="ttsReplayArea" class="tts-replay-area"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "xiaoxing_experimentData";

    function loadExperimentData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        console.error("加载 experimentData 失败：", e);
        return null;
      }
    }

    function saveExperimentData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(window.experimentData || {}));
      } catch (e) {
        console.error("保存 experimentData 失败：", e);
      }
    }

    function recordEvent(type, data) {
      try {
        window.experimentData = window.experimentData || {
          childId: null,
          startTime: null,
          endTime: null,
          condition: null,
          chatHistory: [],
          responses: [],
          pageEvents: [],
          errors: [],
        };

        window.experimentData.pageEvents.push({
          t: new Date().toISOString(),
          type,
          data: data || {},
        });

        saveExperimentData();
      } catch (e) {
        console.error("recordEvent 失败：", e);
      }
    }

    // Initialize global experimentData from localStorage if exists
    window.experimentData = loadExperimentData() || {
      childId: null,
      childName: null,
      startTime: null,
      endTime: null,
      condition: null,
      experimentState: {
        phase: "waiting_ready",
        childName: null,
        currentTopic: null,
        completedTopics: [],
        noQuestionFollowUpUsed: {},
        messages: [],
        errors: [],
      },
      chatHistory: [],
      responses: [],
      pageEvents: [],
      errors: [],
    };

    // Record page load
    recordEvent("page_load", { url: window.location.href });

    // Visibility and beforeunload handlers
    document.addEventListener("visibilitychange", () => {
      recordEvent("visibility_change", { state: document.visibilityState });
    });

    window.addEventListener("beforeunload", () => {
      try {
        window.experimentData.endTime = new Date().toISOString();
        saveExperimentData();
      } catch (e) {}
    });

    window.addEventListener("error", (e) => {
      try {
        window.experimentData.errors.push({
          t: new Date().toISOString(),
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          colno: e.colno,
        });
        saveExperimentData();
      } catch (err) {
        console.error("记录错误失败：", err);
      }
    });

    let recognition = null;
    let isHoldingToTalk = false;
    let isRecognitionRunning = false;
    let finalTranscript = "";
    let voiceMessageHandled = false;
    let lastVoiceError = null;
    let isSending = false;
    let audioUnlocked = false;
    let currentAudio = null;
    let globalTTSAudio = null;
    let isTTSPlaying = false;
    let lastTTSReplayText = "";
    let lastTTSReplayUrl = "";
    let lastTTSReplayBlobSize = 0;

    function getSpeechRecognition() {
      return window.SpeechRecognition || window.webkitSpeechRecognition;
    }

    // Get participant id from input. If `save` is true, persist to experimentData.
    function getParticipantId(save = false) {
      const input = document.getElementById("participantId");

      if (!input) {
        console.warn("没有找到 participantId 输入框");
        return "test_user";
      }

      // iPad/Safari 上点击按钮时键盘可能还没收起，先 blur 一下更稳
      input.blur();

      const value = input.value.trim();

      if (value) {
        if (save) {
          window.experimentData = window.experimentData || {};
          window.experimentData.childId = value;
          saveExperimentData();
        }
        return value;
      }

      return "test_user";
    }

    function createInitialExperimentState() {
      return {
        phase: "waiting_ready",
        childName: null,
        currentTopic: null,
        completedTopics: [],
        noQuestionFollowUpUsed: {},
        messages: [],
        errors: [],
      };
    }

    function ensureExperimentDataShape() {
      window.experimentData = window.experimentData || {};
      window.experimentData.chatHistory = Array.isArray(window.experimentData.chatHistory)
        ? window.experimentData.chatHistory
        : [];
      window.experimentData.responses = Array.isArray(window.experimentData.responses)
        ? window.experimentData.responses
        : [];
      window.experimentData.pageEvents = Array.isArray(window.experimentData.pageEvents)
        ? window.experimentData.pageEvents
        : [];
      window.experimentData.errors = Array.isArray(window.experimentData.errors)
        ? window.experimentData.errors
        : [];

      if (!window.experimentData.experimentState) {
        window.experimentData.experimentState = createInitialExperimentState();
      }

      if (!window.experimentData.experimentState.noQuestionFollowUpUsed) {
        window.experimentData.experimentState.noQuestionFollowUpUsed = {};
      }
      if (!Array.isArray(window.experimentData.experimentState.completedTopics)) {
        window.experimentData.experimentState.completedTopics = [];
      }
    }

    function ensureParticipantSession(participantId) {
      ensureExperimentDataShape();

      const previousChild = window.experimentData.childId || null;
      if (previousChild && previousChild !== participantId) {
        clearExperimentSession(true);
        ensureExperimentDataShape();
        recordEvent("session_closed", { previousChildId: previousChild });
      }

      window.experimentData.childId = participantId;
      if (!window.experimentData.startTime) {
        window.experimentData.startTime = new Date().toISOString();
      }
      saveExperimentData();
    }

    async function unlockAudio() {
  try {
    if (!globalTTSAudio) {
      globalTTSAudio = document.createElement("audio");
      globalTTSAudio.setAttribute("playsinline", "true");
      globalTTSAudio.setAttribute("webkit-playsinline", "true");
      globalTTSAudio.preload = "auto";
      document.body.appendChild(globalTTSAudio);
    }

    // 用一个很短的静音音频，在“开始探索”的点击手势里解锁 audio
    globalTTSAudio.src =
      "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQQAAAAAAA==";
    globalTTSAudio.muted = true;
    globalTTSAudio.volume = 0;

    await globalTTSAudio.play();

    globalTTSAudio.pause();
    globalTTSAudio.currentTime = 0;
    globalTTSAudio.muted = false;
    globalTTSAudio.volume = 1;

    audioUnlocked = true;
    console.log("音频已解锁");
  } catch (error) {
    audioUnlocked = false;
    console.warn("声音激活失败：", error);
  }
    }

    function addMessage(role, text) {
      const chatBox = document.getElementById("chatBox");
      const div = document.createElement("div");

      div.className = "message " + role;
      div.innerText = text;

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sanitizeReplyText(text) {
      return text
        ? text.replace(/\[(ADVANCE_TO_NEXT_TOPIC|END_ACTIVITY|ALL_TOPICS_DONE)\]/g, "").trim()
        : text;
    }

    function syncExperimentState(nextState) {
      if (!nextState) return;

      const previous = { ...window.experimentData.experimentState };
      window.experimentData.experimentState = {
        ...window.experimentData.experimentState,
        ...nextState,
      };

      if (previous.phase !== window.experimentData.experimentState.phase) {
        recordEvent("phase_change", {
          from: previous.phase,
          to: window.experimentData.experimentState.phase,
          childId: window.experimentData.childId,
        });
      }
      if (previous.currentTopic !== window.experimentData.experimentState.currentTopic) {
        recordEvent("topic_change", {
          from: previous.currentTopic,
          to: window.experimentData.experimentState.currentTopic,
          childId: window.experimentData.childId,
        });
      }

      window.experimentData.experimentState.childId = window.experimentData.childId;
      saveExperimentData();
    }

    function renderSavedHistory() {
      const chatBox = document.getElementById("chatBox");
      chatBox.innerHTML = "";
      window.experimentData.chatHistory.forEach((item) => {
        addMessage(item.role, item.text);
      });
    }

    async function startChat() {
      const participantId = getParticipantId(false);

      if (!participantId || participantId === "test_user") {
        document.getElementById("status").innerText =
          "请先输入被试编号，例如 001。";
        return;
      }

      // 音频解锁放在编号验证之后，并且不能阻塞实验开始
      try {
        await unlockAudio();
      } catch (error) {
        console.warn("音频解锁失败，但继续开始探索：", error);
      }

      const chatBox = document.getElementById("chatBox");

      // 移动端有时“开始探索”的点击/触摸事件不稳定；这里统一兜底初始化被试会话。
      ensureParticipantSession(participantId);

      if (chatBox.children.length === 0) {
        if (window.experimentData.chatHistory.length > 0) {
          renderSavedHistory();
        } else {
          const greeting =
            "小朋友你好！让我们一起来进行科学探索吧！你准备好开始了吗～如果你准备好了，可以和我说‘准备好了’！";
          addMessage("assistant", greeting);
          window.experimentData.chatHistory.push({
            role: "assistant",
            text: greeting,
            t: new Date().toISOString(),
          });
        }
      }

      syncExperimentState(window.experimentData.experimentState);
      saveExperimentData();

      recordEvent("start_chat", { childId: participantId });

      document.getElementById("status").innerText =
        "当前被试编号：" + participantId + "。现在可以开始和小星聊天啦。";
    }


    function finishVoiceInput() {
      if (voiceMessageHandled) return;
      voiceMessageHandled = true;

      const text = document.getElementById("userInput").value.trim();

      resetHoldButton();

      if (text) {
        document.getElementById("status").innerText =
          "我听到的是：“" + text + "”。正在发送给小星……";
        sendMessage("voice");
      } else {
        const message = lastVoiceError === "no-speech"
          ? "刚刚没有听清内容，可以再按住说一次，或者直接打字。"
          : "刚刚没有听到内容，可以再按住说一次，或者直接打字。";
        document.getElementById("status").innerText = message;
      }
    }

    function startHoldVoiceInput(event) {
      if (event) {
        event.preventDefault();
      }

      const participantId = getParticipantId(false);

      if (participantId === "test_user") {
        document.getElementById("status").innerText =
          "请先输入被试编号，例如 001。";
        return;
      }


      if (isTTSPlaying) {
        document.getElementById("status").innerText =
          "小星正在说话，请等小星说完再按住说话。";
        return;
      }

      if (isSending) {
        document.getElementById("status").innerText =
          "小星正在回复，请等一下再说话。";
        return;
      }

      const SpeechRecognition = getSpeechRecognition();

      if (!SpeechRecognition) {
        document.getElementById("status").innerText =
          "这个浏览器暂时不支持语音输入，可以直接打字。";
        return;
      }

      if (isHoldingToTalk || isRecognitionRunning) {
        return;
      }

      isHoldingToTalk = true;
      isRecognitionRunning = false;
      voiceMessageHandled = false;
      lastVoiceError = null;
      finalTranscript = "";

      const input = document.getElementById("userInput");
      input.value = "";

      const button = document.getElementById("holdToTalkButton");
      button.innerText = "松开发送";
      button.classList.add("recording");

      recognition = new SpeechRecognition();
      recognition.lang = "zh-CN";
      recognition.interimResults = true;

      // iPad/Safari 对 continuous=true 更容易报 not-allowed / service-not-allowed
      recognition.continuous = false;

      document.getElementById("status").innerText = "小星正在听你说话……";

      recognition.onresult = function (event) {
        let interimTranscript = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript;

          if (event.results[i].isFinal) {
            finalTranscript += text;
          } else {
            interimTranscript += text;
          }
        }

        const currentText = finalTranscript + interimTranscript;
        document.getElementById("userInput").value = currentText;
      };

      recognition.onerror = function (event) {
        console.error("语音识别错误：", event.error, event.message);
        lastVoiceError = event.error || "unknown";

        // 权限类错误必须立刻结束；no-speech 等临时错误交给 onend / 松手后统一处理，
        // 避免浏览器短暂误报后直接丢掉已经识别到的文字。
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          isRecognitionRunning = false;
          isHoldingToTalk = false;
          voiceMessageHandled = true;
          resetHoldButton();
          document.getElementById("status").innerText =
            "iPad 或浏览器暂时不允许继续使用语音。请检查麦克风权限，刷新页面后再试，也可以直接打字。";
          return;
        }

        if (event.error === "no-speech") {
          document.getElementById("status").innerText =
            "刚刚暂时没有听清，可以松开后再试一次，或者直接打字。";
        } else if (event.error === "aborted") {
          document.getElementById("status").innerText =
            "这次语音输入已经停止。";
        } else {
          document.getElementById("status").innerText =
            "语音识别暂时不稳定，可以再按住说一次，或者直接打字。";
        }
      };

      recognition.onend = function () {
        isRecognitionRunning = false;

        // 如果儿童还按着按钮，等他松手时再发送，避免 iPad 自动结束后重复发送
        if (isHoldingToTalk) {
          document.getElementById("status").innerText =
            "语音输入已结束，可以松开按钮发送。";
          return;
        }

        finishVoiceInput();
      };

      try {
        recognition.start();
        isRecognitionRunning = true;
        recordEvent("voice_start", { childId: participantId });
      } catch (error) {
        console.error("启动语音识别失败：", error);

        isRecognitionRunning = false;
        isHoldingToTalk = false;
        voiceMessageHandled = true;
        resetHoldButton();

        document.getElementById("status").innerText =
          "语音输入启动失败，可以再试一次，或者直接打字。";
      }
    }

    function stopHoldVoiceInput(event) {
      if (event) {
        event.preventDefault();
      }

      if (!isHoldingToTalk && !isRecognitionRunning) return;

      isHoldingToTalk = false;

      document.getElementById("status").innerText =
        "语音输入结束，正在整理你说的话……";

      if (recognition && isRecognitionRunning) {
        try {
          recognition.stop();
        } catch (error) {
          console.warn("停止语音识别失败，直接整理已识别内容：", error);
          isRecognitionRunning = false;
          finishVoiceInput();
        }
      } else {
        finishVoiceInput();
      }

      recordEvent("voice_end", { childId: getParticipantId() });
    }

    function cancelHoldVoiceInput(event) {
      if (event) {
        event.preventDefault();
      }

      if (!isHoldingToTalk && !isRecognitionRunning) return;

      isHoldingToTalk = false;
      voiceMessageHandled = true;

      if (recognition && isRecognitionRunning) {
        try {
          recognition.abort();
        } catch (error) {
          console.warn("取消语音识别失败：", error);
        }
      }

      isRecognitionRunning = false;
      resetHoldButton();

      document.getElementById("userInput").value = "";
      document.getElementById("status").innerText =
        "已经取消这次语音输入，可以重新按住说话。";

      recordEvent("voice_cancel", { childId: getParticipantId() });
    }

    function resetHoldButton() {
      const button = document.getElementById("holdToTalkButton");
      button.innerText = "按住说话";
      button.classList.remove("recording");
    }

    function removeTTSReplayButton() {
      const area = document.getElementById("ttsReplayArea");
      if (area) area.innerHTML = "";
    }

    function clearCachedTTSReplayUrl() {
      if (lastTTSReplayUrl) {
        try {
          URL.revokeObjectURL(lastTTSReplayUrl);
        } catch (e) {}
      }
      lastTTSReplayUrl = "";
      lastTTSReplayBlobSize = 0;
    }

    async function fetchTTSAudioUrl(text) {
      const ttsResponse = await fetch("/api/tts", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          text: text,
        }),
      });

      if (!ttsResponse.ok) {
        let errMsg = "TTS 语音生成失败";
        try {
          const errData = await ttsResponse.json();
          errMsg = errData.error || errMsg;
        } catch {}
        throw new Error(errMsg);
      }

      const audioBlob = await ttsResponse.blob();
      if (!audioBlob || audioBlob.size < 1000) {
        throw new Error("TTS 返回的音频太小，可能没有成功生成声音");
      }

      return {
        url: URL.createObjectURL(audioBlob),
        size: audioBlob.size,
      };
    }

    function showTTSReplayButton(text, reason = "") {
      const area = document.getElementById("ttsReplayArea");
      if (!area || !text) return;

      lastTTSReplayText = text;
      area.innerHTML = "";

      const hint = document.createElement("div");
      hint.style.color = "#607d8b";
      hint.style.fontSize = "14px";
      hint.style.marginBottom = "6px";
      hint.innerText = reason || "如果刚刚没有听到小星的声音，可以点下面按钮再播放一次。";

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tts-replay-button";
      btn.innerText = "再听一次小星的话";
      btn.onclick = function () {
        if (!lastTTSReplayUrl) {
          btn.innerText = "没有可播放的语音，请让小星再回复一次";
          document.getElementById("status").innerText =
            "这条语音没有缓存成功，可以继续对话让小星再回复一次。";
          return;
        }

        btn.disabled = true;
        btn.innerText = "正在播放……";
        document.getElementById("status").innerText = "小星正在说话……";

        // 关键：这里不要重新 fetch，也不要先 await unlockAudio。
        // iPad Chrome 上，按钮点击后的用户手势很短；必须尽快调用 audio.play()。
        playPreparedTTS(lastTTSReplayUrl, {
          text: lastTTSReplayText,
          manual: true,
          size: lastTTSReplayBlobSize,
        })
          .then(() => {
            document.getElementById("status").innerText =
              "小星已经回复啦。你可以继续按住按钮说话。";
            btn.disabled = false;
            btn.innerText = "再播放一次小星语音";
          })
          .catch((error) => {
            console.error("手动播放 TTS 失败：", error);
            btn.disabled = false;
            btn.innerText = "再试一次播放小星语音";
            document.getElementById("status").innerText =
              "语音播放还是不稳定，可以再点一次播放按钮，或者直接继续对话。";
            recordEvent("tts_manual_play_failed", {
              message: error.message,
              childId: getParticipantId(),
            });
          });
      };

      area.appendChild(hint);
      area.appendChild(btn);
    }

    function waitForAudioFinish(audio, timeoutMs) {
      return new Promise((resolve, reject) => {
        let done = false;
        const cleanup = () => {
          clearTimeout(timer);
          audio.removeEventListener("ended", onEnded);
          audio.removeEventListener("pause", onPause);
          audio.removeEventListener("error", onError);
        };
        const finish = (result) => {
          if (done) return;
          done = true;
          cleanup();
          resolve(result);
        };
        const onEnded = () => finish("ended");
        const onPause = () => {
          // currentTime > 0 说明至少尝试播放过；不要让按钮一直卡住。
          if (audio.currentTime > 0) finish("pause");
        };
        const onError = () => {
          if (done) return;
          done = true;
          cleanup();
          reject(new Error("audio 播放出错"));
        };
        const timer = setTimeout(() => {
          // iPad Chrome 有时不会触发 ended。超时后按“完成一次播放尝试”处理，避免 UI 卡死。
          finish("timeout");
        }, timeoutMs);

        audio.addEventListener("ended", onEnded, { once: true });
        audio.addEventListener("pause", onPause, { once: true });
        audio.addEventListener("error", onError, { once: true });
      });
    }

    async function playPreparedTTS(audioUrl, options = {}) {
      const manual = Boolean(options.manual);
      const text = options.text || "";
      const size = options.size || 0;

      if (!globalTTSAudio) {
        globalTTSAudio = document.createElement("audio");
        globalTTSAudio.setAttribute("playsinline", "true");
        globalTTSAudio.setAttribute("webkit-playsinline", "true");
        globalTTSAudio.preload = "auto";
        document.body.appendChild(globalTTSAudio);
      }

      try {
        globalTTSAudio.pause();
        globalTTSAudio.currentTime = 0;
      } catch {}

      globalTTSAudio.src = audioUrl;
      globalTTSAudio.muted = false;
      globalTTSAudio.volume = 1;
      globalTTSAudio.load();

      isTTSPlaying = true;
      const voiceButton = document.getElementById("holdToTalkButton");
      if (voiceButton) voiceButton.disabled = true;

      try {
        await globalTTSAudio.play();
        recordEvent("tts_play", {
          text,
          childId: getParticipantId(),
          size,
          manual,
        });

        // 最多等 18 秒，避免 iPad Chrome 不触发 ended 时按钮一直“正在播放”。
        const result = await waitForAudioFinish(globalTTSAudio, 18000);
        recordEvent("tts_finish", {
          text,
          childId: getParticipantId(),
          manual,
          result,
          duration: globalTTSAudio.duration || null,
          currentTime: globalTTSAudio.currentTime || null,
        });
      } finally {
        isTTSPlaying = false;
        if (voiceButton) voiceButton.disabled = false;
      }
    }

    async function playTTS(text, options = {}) {
      const manual = Boolean(options.manual);
      if (!manual) {
        removeTTSReplayButton();
        clearCachedTTSReplayUrl();
      }

      // 自动播放时先生成一次语音并缓存。手动按钮直接播放缓存，避免 iPad Chrome 用户手势失效。
      if (!lastTTSReplayUrl || lastTTSReplayText !== text) {
        const prepared = await fetchTTSAudioUrl(text);
        lastTTSReplayUrl = prepared.url;
        lastTTSReplayBlobSize = prepared.size;
        lastTTSReplayText = text;
      }

      await playPreparedTTS(lastTTSReplayUrl, {
        text,
        manual,
        size: lastTTSReplayBlobSize,
      });
    }


    async function sendMessage(via = "text") {
      if (isSending) return;

      const participantId = getParticipantId(false);

      if (!participantId || participantId === "test_user") {
        document.getElementById("status").innerText =
          "请先输入被试编号，例如 001。";
        return;
      }

      // 即使平板/手机没有成功点击“开始探索”，发送第一句话时也会绑定 ID 并初始化状态。
      ensureParticipantSession(participantId);

      const input = document.getElementById("userInput");
      const userText = input.value.trim();

      if (!userText) return;

      isSending = true;

      // record user message
      window.experimentData.chatHistory.push({ role: "user", text: userText, t: new Date().toISOString(), via });
      saveExperimentData();

      addMessage("user", userText);
      input.value = "";

      document.getElementById("status").innerText = "小星正在想一想……";
      const priorChatHistory = window.experimentData.chatHistory.slice(0, -1);

      try {
        const chatResponse = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            childId: participantId,
            currentTopic: window.experimentData.experimentState.currentTopic || null,
            userQuestion: userText,
            conversationHistory: priorChatHistory,
            state: window.experimentData.experimentState,
          }),
        });

        let chatData;
        try {
          chatData = await chatResponse.json();
        } catch (parseError) {
          throw new Error("收到的不是 JSON 响应：" + parseError.message);
        }

        if (!chatResponse.ok) {
          throw new Error(chatData.error || "AI 回复失败");
        }

        const replyText = sanitizeReplyText(chatData.reply || "小星暂时无法回复，请稍后再试。");

        if (chatData.ok === false) {
          window.experimentData.errors.push({
            t: new Date().toISOString(),
            message: chatData.error || "AI 处理失败",
            reply: replyText,
          });
        }

        if (chatData.nextState) {
          syncExperimentState(chatData.nextState);
        }

        // record assistant reply
        window.experimentData.chatHistory.push({
          role: "assistant",
          text: replyText,
          t: new Date().toISOString(),
        });
        window.experimentData.responses.push({ text: replyText, t: new Date().toISOString() });
        saveExperimentData();

        addMessage("assistant", replyText);

        try {
          document.getElementById("status").innerText =
            "小星正在说话……";

          await playTTS(replyText);
          showTTSReplayButton(replyText, "如果没有听到小星的声音，可以点这里再听一次。");

          document.getElementById("status").innerText =
            "小星已经回复啦。你可以继续按住按钮说话。";
        } catch (ttsError) {
          console.error("TTS 播放失败：", ttsError);
          window.experimentData.errors.push({
            t: new Date().toISOString(),
            message: "TTS 播放失败：" + ttsError.message,
          });
          saveExperimentData();

          showTTSReplayButton(replyText, "小星刚才没有成功播放声音，可以点这里再试一次。");
          document.getElementById("status").innerText =
            "小星已经回复啦，但语音播放暂时失败。你可以点播放按钮，或者继续按住按钮说话。";
        }
      } catch (error) {
        console.error(error);
        const fallbackReply = "小星暂时无法回复，请稍后再试。";
        addMessage("assistant", fallbackReply);
        document.getElementById("status").innerText =
          "出错了：" + error.message;

        // record error
        window.experimentData.errors.push({
          t: new Date().toISOString(),
          message: error.message,
          fallbackReply,
        });
        saveExperimentData();
      } finally {
        isSending = false;
      }
    }

    async function resetChat() {
      try {
        // ask backend for cleared nextState (not strictly necessary but keeps parity)
        const res = await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" } });
        let resData = null;
        try {
          resData = await res.json();
        } catch (e) {}

        // clear frontend session (including childId) so researcher can enter a new ID
        clearExperimentSession(true);

        document.getElementById("chatBox").innerHTML = "";
        document.getElementById("userInput").value = "";
        document.getElementById("status").innerText =
          "已经重新开始。请重新确认被试编号，然后点击“开始探索”。";

        if (recognition) {
          try {
            recognition.abort();
          } catch (error) {
            console.warn("重置时取消语音识别失败：", error);
          }
        }
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }
        if (globalTTSAudio) {
          try {
            globalTTSAudio.pause();
            globalTTSAudio.currentTime = 0;
          } catch (error) {
            console.warn("重置时停止 TTS 失败：", error);
          }
        }
        removeTTSReplayButton();

        isHoldingToTalk = false;
        isRecognitionRunning = false;
        voiceMessageHandled = false;
        isSending = false;
        finalTranscript = "";
        lastVoiceError = null;
        audioUnlocked = false;
        isTTSPlaying = false;
        lastTTSReplayText = "";
        clearCachedTTSReplayUrl();
        resetHoldButton();
      } catch (error) {
        console.error(error);
        document.getElementById("status").innerText =
          "重新开始时出错了：" + error.message;
      }
    }

    // Clear experiment session data in frontend. If keepPageEvents is true, retain pageEvents for exports.
    function clearExperimentSession(keepPageEvents = true) {
      try {
        const preserved = (window.experimentData && window.experimentData.pageEvents && keepPageEvents)
          ? window.experimentData.pageEvents.slice() : [];

        window.experimentData = {
          childId: null,
          childName: null,
          startTime: null,
          endTime: null,
          condition: null,
          experimentState: {
            phase: "waiting_ready",
            childName: null,
            currentTopic: null,
            completedTopics: [],
            noQuestionFollowUpUsed: {},
            messages: [],
            errors: [],
          },
          chatHistory: [],
          responses: [],
          pageEvents: preserved,
          errors: [],
        };

        saveExperimentData();
      } catch (e) {
        console.error("clearExperimentSession failed:", e);
      }
    }

    const startChatBtn = document.getElementById("startChatBtn");
    if (startChatBtn) {
      let lastStartTouchAt = 0;

      startChatBtn.addEventListener("touchend", (e) => {
        e.preventDefault();
        lastStartTouchAt = Date.now();
        startChat();
      }, { passive: false });

      startChatBtn.addEventListener("click", (e) => {
        // 某些移动端 touchend 后还会补一个 click，避免 startChat 连续跑两次。
        if (Date.now() - lastStartTouchAt < 700) {
          e.preventDefault();
          return;
        }
      });
    }

    // Record input changes for participantId and userInput
    document.getElementById("participantId").addEventListener("change", (e) => {
      recordEvent("input_participantId", { value: e.target.value });
    });

    document.getElementById("userInput").addEventListener("change", (e) => {
      recordEvent("input_user", { value: e.target.value });
    });

    // Record general clicks (avoid logging too frequently for inputs)
    document.addEventListener("click", (e) => {
      try {
        const el = e.target;
        const info = {
          tag: el.tagName,
          id: el.id || null,
          classes: el.className || null,
          text: (el.innerText || "").slice(0, 100),
        };
        recordEvent("click", info);
      } catch (err) {}
    });

    // Download data helper
    function downloadData() {
      try {
        const data = window.experimentData || {};
        const child = data.childId || "unknown_child";
        const filename = `${child}_science_exploration_data.json`;
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        recordEvent("download_data", { filename });
      } catch (e) {
        console.error("导出数据失败：", e);
      }
    }

    document
      .getElementById("userInput")
      .addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
    window.addEventListener("load", () => {
      if (window.experimentData.chatHistory.length > 0) {
        renderSavedHistory();
      }
    });
  </script>
