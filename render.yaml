services:
  - type: web
    name: xiaoxing-api-chat
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TTS_PROVIDER
        value: doubao
      - key: DOUBAO_API_KEY
        sync: false
      - key: DOUBAO_TTS_VOICE
        value: zh_female_linjianvhai_uranus_bigtts
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: nova
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-transcribe
